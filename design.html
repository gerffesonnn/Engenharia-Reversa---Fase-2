<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design | Lamborghini</title>
    <link rel="stylesheet" href="design.css">
</head>

<body>
    <div class="design-page">
        <header class="design-header">
            <button class="menu-trigger" type="button" aria-label="Open menu">
                <span class="hamburger"></span>
                <span class="menu-label">MENU</span>
            </button>

            <div class="brand-mark" aria-label="Lamborghini logo">
                <img src="imgs/logo_header_01.png.svg" alt="Lamborghini">
            </div>

            <button class="search-trigger" type="button" aria-label="Search">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5"></circle>
                    <path d="m16 16 5 5"></path>
                </svg>
            </button>
        </header>

        <main class="design-hero">
            <div class="timeline-row">
                <span class="label">GALLARDO 2003</span>
                <span class="label">HURACAN 2014</span>
                <span class="label">TEMERARIO 2024</span>
            </div>

            <div class="video-panel">
                <video class="design-video" autoplay muted loop playsinline poster="imgs/ChatGPT Image 17 de set. de 2026, 14_54_47.png">
                    <source src="Gravação de Tela 2026-10-08 160323.mp4" type="video/mp4">
                </video>
                <div class="video-overlay"></div>
            </div>

            <div class="design-copy">
                <p class="eyebrow">LAMBORGHINI DESIGN</p>
                <h1>
                    <span class="title-line">CENTRO</span>
                    <span class="title-line title-accent">STILE</span>
                </h1>
                <p class="lead">
                    With just a few elegant and accurate lines, it is possible to create a new Lamborghini.
                </p>
            </div>

            <div class="design-footer">
                <div class="model-name">HURACAN</div>
                <div class="model-year">2024</div>
            </div>
        </main>

        <div class="cookie-banner" aria-label="Cookie banner">
            <div class="cookie-copy">
                <span>Our website uses cookies</span>
            </div>
            <div class="cookie-actions">
                <button type="button">Accept</button>
                <a href="#">Learn more</a>
            </div>
        </div>
    </div>
</body>

</html>
